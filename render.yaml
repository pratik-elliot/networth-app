services:
  - type: web
    name: networth-app
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: cd client && npm install --include=dev && npm run build && cd ../server && npm install
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      # Paths are relative to the process CWD, which on Render is the repo
      # root, so these keep the DB and uploads under server/ as the local
      # defaults and .gitignore expect.
      #
      # On the free plan there is no persistent disk attached, so this data is
      # wiped on every redeploy and on every spin-down/spin-up after idle.
      # Upgrade to a paid plan + attach a disk (mounted e.g. at /var/data) for
      # real persistence, then set these to /var/data/networth.db and
      # /var/data/uploads.
      - key: DB_PATH
        value: ./server/data/networth.db
      - key: UPLOAD_DIR
        value: ./server/uploads
      # Same-origin deployment (client is served by this same service), so
      # CORS isn't actually exercised, but the app still needs a value.
      - key: CLIENT_ORIGIN
        value: "*"
      # Email delivery for OTP login codes. Set RESEND_API_KEY from the Render
      # dashboard (Environment tab) — Resend sends over HTTPS, which works on
      # the free plan. Render blocks outbound SMTP ports 25/465/587 on free
      # instances, so the SMTP_* settings below only work on a paid plan.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: OTP_TTL_MINUTES
        value: 10
