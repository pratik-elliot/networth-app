services:
  - type: web
    name: networth-app
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: cd client && npm install --include=dev && npm run build && cd ../server && npm install
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      # All data lives in MongoDB Atlas, so nothing depends on Render's
      # ephemeral disk any more. Set the URI in the dashboard.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: networth
      # Statement import. Set the key in the dashboard; every request demands a
      # zero-data-retention provider and fails closed if none is available.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: inclusionai/ling-3.0-flash:free
      # Same-origin deployment (client is served by this same service), so
      # CORS isn't actually exercised, but the app still needs a value.
      - key: CLIENT_ORIGIN
        value: "*"
      # Email delivery for OTP login codes. Set RESEND_API_KEY from the Render
      # dashboard (Environment tab) — Resend sends over HTTPS, which works on
      # the free plan. Render blocks outbound SMTP ports 25/465/587 on free
      # instances, so the SMTP_* settings below only work on a paid plan.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: OTP_TTL_MINUTES
        value: 10
